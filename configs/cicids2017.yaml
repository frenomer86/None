seed: 42
experiment_name: cicids2017_full

paths:
  raw_csv: /path/to/CICIDS2017.csv
  data_root: data
  output_root: outputs

dataset:
  name: cicids2017
  auto_download: true
  label_col: Label
  timestamp_col: Timestamp
  positive_regex: "(?i)(attack|ddos|dos|bot|brute|infiltration|web|portscan|patator)"
  drop_columns: []
  max_rows: null

features:
  packet_count_col: Total Fwd Packets
  flow_duration_col: Flow Duration
  bytes_col: Flow Bytes/s
  iat_mean_col: Flow IAT Mean

preprocessing:
  clip_iqr: true
  normalize: minmax
  train_ratio: 0.7
  val_ratio: 0.15

model:
  input_dim: null
  hidden_dim: 256
  latent_dim: 128
  rnn_layers: 2
  dropout: 0.2
  aggr: mean

training:
  batch_size: 256
  epochs: 30
  lr: 0.0001
  weight_decay: 0.00001
  kl_weight: 0.1
  agil_weight: 0.5
  adv_steps: 5
  adv_eps: 0.05
  grad_clip: 5.0
  early_stopping_patience: 7

online_transfer:
  enabled: true
  window_len: 500
  update_lr: 0.00005
  replay_weight: 0.5

evaluation:
  threshold: 0.5
  few_shot_ns: [1, 3, 5, 10]
  few_shot_repeats: 10
  save_confusion: true

ablations:
  - full
  - no_dart
  - no_agil
  - no_online_tl
