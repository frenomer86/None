[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftdart"
version = "0.1.0"
description = "Real-time encrypted traffic drift detection with DART+AGIL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "joblib>=1.3",
  "scipy>=1.11"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

